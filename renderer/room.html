<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CC Talk</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="room-window">
  <div id="chat-view">
    <header id="chat-header">
      <div>
        <div id="chat-title"></div>
        <div id="chat-sub"></div>
      </div>
      <div class="header-actions">
        <button id="btn-phone" data-tip="폰에서 사진 넣기 — QR을 찍으세요 (같은 Wi-Fi)">📱</button>
        <button id="btn-perm" data-tip="권한 모드 — 이 방에만 적용">🛡</button>
        <button id="btn-stop" class="hidden" data-tip="작업 중단 — 이번 턴만 멈추고 세션은 유지"><span class="stop-icon"></span></button>
        <button id="btn-kill" data-tip="세션 종료 — 프로세스를 내리고, 다음 메시지 때 이어서 재시작">⏻</button>
      </div>
    </header>

    <div id="search-bar" class="hidden">
      <input id="search-input" type="text" placeholder="대화 검색" spellcheck="false" />
      <span id="search-count"></span>
      <button id="search-prev" data-tip="이전 (Shift+Enter)">↑</button>
      <button id="search-next" data-tip="다음 (Enter)">↓</button>
      <button id="search-close" data-tip="닫기 (ESC)">✕</button>
    </div>

    <div id="task-panel" class="hidden">
      <button id="task-bar">
        <span id="task-caret">▸</span>
        <span id="task-label">할 일</span>
        <span id="task-count"></span>
        <span id="task-progress"><i id="task-progress-fill"></i></span>
      </button>
      <ul id="task-list" class="hidden"></ul>
    </div>

    <div id="messages-wrap">
      <div id="messages"></div>
      <button id="jump-bottom" class="hidden" data-tip="맨 아래로">↓</button>
    </div>

    <div id="pending-bar" class="hidden"></div>

    <div id="attach-bar" class="hidden"></div>

    <div id="slash-menu" class="hidden"></div>

    <footer id="composer">
      <textarea id="input" rows="1" placeholder="메시지 입력" data-tip="Enter 전송 · Shift+Enter 줄바꿈"></textarea>
      <button id="btn-send" data-tip="전송 (Enter)">전송</button>
    </footer>

    <div id="statusbar"></div>
  </div>

  <div id="drop-overlay" class="hidden">
    <div class="drop-inner">📎 여기에 놓으면 첨부돼요<br /><span>사진은 이미지로, 파일은 경로로 전달</span></div>
  </div>

  <div id="model-picker" class="hidden">
    <div class="picker-card">
      <div class="picker-title">모델 선택 <span>이 방(세션)에만 적용</span></div>
      <div id="model-list"></div>
    </div>
  </div>

  <div id="qr-modal" class="hidden">
    <div class="picker-card">
      <div class="picker-title">폰에서 사진 넣기 <span>같은 Wi-Fi · 10분간 유효</span></div>
      <div id="qr-body">
        <img id="qr-img" alt="QR" />
        <div id="qr-url"></div>
        <div id="qr-hint">폰 카메라로 QR을 찍으면 사진 고르는 화면이 열려요</div>
      </div>
    </div>
  </div>

  <div id="perm-picker" class="hidden">
    <div class="picker-card">
      <div class="picker-title">권한 모드 <span>이 방에만 적용 · 즉시 반영</span></div>
      <div id="perm-list"></div>
    </div>
  </div>
  <script src="room.js"></script>
</body>
</html>
